name: Worker tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Match the Node.js version used locally (v24)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Install all workspace dependencies from the root lockfile
      - name: Install dependencies
        run: npm ci

      # Run only the worker's Jest tests; --runInBand keeps them serial so
      # tests don't race for shared resources in the CI container
      - name: Run worker tests
        run: npm run test -w worker -- --runInBand

      # Confirm the worker still compiles cleanly after the tests pass
      - name: Build worker
        run: npm run build -w worker

